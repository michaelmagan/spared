# Docker: build and push a multi-arch (linux/amd64, linux/arm64) image to ghcr.io/<owner>/<repo>,
# with BuildKit provenance and an SBOM attached to the image and a build-provenance attestation
# pushed next to it (verify with: gh attestation verify oci://ghcr.io/<owner>/spared:<tag> --repo <owner>/spared).
# Triggers: tags v*, and manual dispatch. Uses only the built-in GITHUB_TOKEN.
#
# Tags pushed for a release tag vX.Y.Z[-pre]:
#   X.Y.Z[-pre]   always. scripts/try.sh pulls this tag (scripts/test-try.sh checks they agree).
#   X.Y, latest   only when the version is not a prerelease (no '-' in the tag).
# A manual dispatch from a branch pushes sha-<commit> only.
#
# This workflow builds `Dockerfile` at the repo root with the repository root as build context.
# Run the same build locally (single arch, no push):
#   docker buildx build --platform linux/amd64 -f Dockerfile -t spared:local --load .
# Multi-arch needs QEMU: docker run --privileged --rm tonistiigi/binfmt --install all
# The linux/arm64 image is built under QEMU emulation.
# Actions are pinned to full commit SHAs; the comment after each names the release.
name: docker

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name (ghcr.io names are lowercase)
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.name.outputs.image }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=sha,enable=${{ github.ref_type != 'tag' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SPARED_GIT_SHA=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
