[package]
name = "loadgen"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"

[workspace]

[dependencies]
bytes = "1"
libc = "0.2"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "net", "time", "sync"] }

[profile.release]
opt-level = 3
