# Fly app configuration for the spared server image.
# Rendered by scripts/try.sh with the app name and image filled in. Hosted platforms give one
# hostname, so apps are reached by path: https://<app-name>.fly.dev/_/<spared app>/ .
app = "__APP__"
primary_region = "iad"

[build]
  image = "__IMAGE__"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  grace_period = "30s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/healthz"

[mounts]
  source = "spared_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
