[package]
name = "demo-spared"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
wstd = "0.6.8"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
