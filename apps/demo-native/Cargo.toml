[package]
name = "demo-native"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"

[workspace]

[dependencies]
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
