<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="spared vs workerd. 2.6x faster warm requests (148 vs 388 µs at the median). 3.0x lower p99 under load (5.45 vs 16.53 ms at 16 connections). 0.9 ms to wake an idle app with its code in the page cache, about level with workerd (1.07 ms). 4.8x less memory that cannot be reclaimed (108 vs 516 MiB at 200 apps). 1.5x more total memory at 200 apps (889 vs 574 MiB), lower below about 20 apps. Same small app on both hosts, Rust on spared and JavaScript on workerd. One 4-vCPU VM."><title>spared vs workerd. 2.6x faster warm requests (148 vs 388 µs at the median). 3.0x lower p99 under load (5.45 vs 16.53 ms at 16 connections). 0.9 ms to wake an idle app with its code in the page cache, about level with workerd (1.07 ms). 4.8x less memory that cannot be reclaimed (108 vs 516 MiB at 200 apps). 1.5x more total memory at 200 apps (889 vs 574 MiB), lower below about 20 apps. Same small app on both hosts, Rust on spared and JavaScript on workerd. One 4-vCPU VM.</title><rect width="1200" height="675" fill="#0a0a0a"/><rect x="64.0" y="29.0" width="32.0" height="32.0" rx="8" fill="#7c7cff" stroke="none" stroke-width="0"/><text x="80.0" y="52.5" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#0a0a0a" text-anchor="middle" letter-spacing="0">S</text><text x="110.0" y="54.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" text-anchor="start" letter-spacing="-0.3" xml:space="preserve"><tspan fill="#ededed" font-weight="600">spared</tspan><tspan fill="#a1a1a1" font-weight="500">  vs workerd</tspan></text><line x1="0.0" y1="88.0" x2="1200.0" y2="88.0" stroke="#262626" stroke-width="1" stroke-linecap="round"/><line x1="59.0" y1="88.0" x2="69.0" y2="88.0" stroke="#444444" stroke-width="1" stroke-linecap="round"/><line x1="64.0" y1="83.0" x2="64.0" y2="93.0" stroke="#444444" 