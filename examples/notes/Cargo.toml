[package]
name = "notes"
version = "0.1.0"
edition = "2024"

[dependencies]
wstd = "0.6.8"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 2
lto = false
codegen-units = 16
strip = true

[workspace]
